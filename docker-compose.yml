version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reports
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: "./api server"
    volumes:
      - ./api server:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./api server/.env

volumes:
  db_data:
